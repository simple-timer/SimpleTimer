product: jvm/app

repositories:
  - url: https://jitpack.io
  - url: https://m2.dv8tion.net/releases

dependencies:
  - $libs.kotlin.corountine.core
  - $libs.kotlin.reflect
  - $libs.jda
  - $libs.logback.classic
  - $libs.lavaplayer.fork
  - $libs.lavaplayer.natives.fork
  - $libs.kotaml
  - $libs.kotlinx.serialization.json
  - $libs.bcdice.kt
  - $libs.exposed.core
  - $libs.exposed.jdbc
  - $libs.exposed.java.time
  - $libs.exposed.json
  - $libs.postgresql
  - $libs.ktor.client
  - $libs.ktor.client.cio
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json

settings:
  kotlin:
    version: 2.4.21
    serialization:
      version: 1.12.0
      enabled: true
    freeCompilerArgs:
      - -Xskip-prerelease-check
      - -Xallow-unstable-dependencies
  jvm:
    mainClass: dev.simpletimer.SimpleTimerKt
    release: 26
    jdk:
      version: 26
