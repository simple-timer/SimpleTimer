services:
  app:
    build: .
    environment:
      - SIMPLETIMER_TOKEN=${SIMPLETIMER_TOKEN}
      - SIMPLETIMER_SHARDS_COUNT=1
      - SIMPLETIMER_DB_ADDRESS=db:5432
      - SIMPLETIMER_DB_SCHEME=${DB_SCHEMA}
      - SIMPLETIMER_DB_USER=${DB_USER}
      - SIMPLETIMER_DB_PASS=${DB_PASSWORD}
    volumes:
      - ./data:/app/data
  db:
    image: postgres:18.6-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_SCHEMA}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    pull_policy: always
    volumes:
      - db-storage:/var/lib/postgresql
volumes:
  db-storage:
