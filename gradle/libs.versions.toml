[versions]
kotlin = "2.4.21"
kotlinx-coroutines-core = "1.7.3"
ktor-client = "3.6.0"
jda = "5.0.0-beta.20"
logback = "1.4.14"
lavaplayer = "1.4.3"
lavaplayer-natives = "1.0.2"
kotaml = "0.112.0"
kotlinx-serialization-json = "1.12.0"
bcdice-kt = "1.7.2"
exposed = "0.47.0"
postgresql = "42.7.14"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-corountine-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines-core" }
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
lavaplayer-fork = { module = "com.github.walkyst:lavaplayer-fork", version.ref = "lavaplayer" }
lavaplayer-natives-fork = { module = "com.github.Walkyst:lavaplayer-natives-fork", version.ref = "lavaplayer-natives" }
kotaml = { module = "io.heapy.kotaml:kotaml", version.ref = "kotaml" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
bcdice-kt = { module = "com.github.simple-timer:bcdice-kt", version.ref = "bcdice-kt" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
ktor-client = { module = "io.ktor:ktor-client-core", version.ref = "ktor-client" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor-client" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor-client" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor-client" }

